      #lyrics {

        position: fixed;
        left: 50%;
        bottom: 72vh;
        transform: translateX(-50%);

        font-weight: bold;
        letter-spacing: 4px;

      @media only screen and (max-width: 600px) {
        #lyrics {
          font-size: 15px;
          letter-spacing: 2px;
        }
      }

      /* Gatito: anim.js le da la altura y lo pone encima de la flor más alta */
      #gatito {
        position: fixed;
        left: 50%;
        bottom: 60vh;
        height: 160px;
        width: auto;
        transform: translateX(-50%);
        opacity: 0;
        z-index: 6;
        pointer-events: none;
        /* el contorno dorado ya viene dibujado dentro de gatito.webp */
      }
      #gatito.listo {
        animation: gatitoEntra 0.8s ease-out forwards;
      }
      #gatito.listo.oculto {
        animation: gatitoSale 0.8s ease-in forwards;
      }
      @keyframes gatitoEntra {
        from { opacity: 0; transform: translateX(-50%) scale(0.6); }
        to { opacity: 1; transform: translateX(-50%) scale(1); }
      }
      @keyframes gatitoSale {
        from { opacity: 1; transform: translateX(-50%) scale(1); }
        to { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(0.6); }
      }

      /* Animación de la letra: entrada por palabra, ola por letra y borde dorado */
      #lyrics {
        transition: opacity 0.7s ease, filter 0.7s ease;
      }
      #lyrics .palabra {
        display: inline-block;
        white-space: nowrap;
        opacity: 0;
        animation: entrarPalabra 0.6s ease-out forwards;
      }
      #lyrics .letra {
        display: inline-block;
        color: #fffbe6;
        -webkit-text-stroke: 1px #ffc400;
        animation: ola 1.6s ease-in-out infinite, brilloDorado 2.4s ease-in-out infinite;
      }
      #lyrics.saliendo {
        opacity: 0;
        filter: blur(6px);
      }
      @keyframes entrarPalabra {
        0% { opacity: 0; transform: translateY(20px) scale(0.8); filter: blur(6px); }
        60% { opacity: 1; transform: translateY(-4px) scale(1.08); filter: blur(0); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes ola {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes brilloDorado {
        0%, 100% {
          text-shadow: 0 0 4px #ffd700, 0 0 10px rgba(255, 200, 0, 0.6);
        }
        50% {
          text-shadow: 0 0 6px #fff3b0, 0 0 16px #ffd700, 0 0 30px rgba(255, 170, 0, 0.9);
        }
      }
      @media only screen and (max-width: 600px) {
        #lyrics .letra {
          -webkit-text-stroke: 0.5px #ffc400;
        }
      }

        "Tu sonrisa ilumina todo ✨",
        "Eres una mujer bien hermosa🌻",

      ];

      function lluviaFrases() {
  const loveRain = document.getElementById("loveRain");

  // cuántas frases quieres que caigan al mismo tiempo
  const cantidad = 2 + Math.floor(Math.random() * 2); // entre 2 y 3

  for (let i = 0; i < cantidad; i++) {
    const frase = document.createElement("div");
    frase.classList.add("love-phrase");
    frase.innerText = frases[Math.floor(Math.random() * frases.length)];
    frase.style.left = Math.random() * 90 + "vw";
    frase.style.animationDuration = 4 + Math.random() * 4 + "s";
    loveRain.appendChild(frase);
    setTimeout(() => frase.remove(), 8000);
  }
}

// más rápido: cada 1.5s
setInterval(lluviaFrases, 2000);
